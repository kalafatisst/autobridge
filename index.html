<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBridge — Vehicle Imports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black:  #080a0e;
    --dark:   #0f1219;
    --card:   #141820;
    --red:    #c41a1a;
    --red2:   #e02020;
    --gold:   #c8920a;
    --white:  #f0f0f6;
    --gray:   #6a6a88;
    --lgray:  #9090aa;
  }

  html, body {
    min-height: 100vh;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }

  /* Animated background mesh */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 50%, rgba(196,26,26,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 30%, rgba(200,146,10,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 100% 100% at 50% 100%, rgba(196,26,26,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0%   { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Noise texture overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ─── CARD ─────────────────────────────────────────── */
  .card {
    position: relative;
    z-index: 1;
    width: min(440px, 94vw);
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 32px 80px rgba(0,0,0,0.7),
      0 0 60px rgba(196,26,26,0.08);
    animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes cardIn {
    from { opacity:0; transform: translateY(32px) scale(0.96); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  /* Top red stripe */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red2) 50%, var(--gold) 100%);
    z-index: 10;
  }

  /* ─── HERO ──────────────────────────────────────────── */
  .hero {
    position: relative;
    padding: 36px 32px 28px;
    background: linear-gradient(160deg, #1a1e2a 0%, #0f1219 100%);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
  }

  /* Diagonal accent */
  .hero::after {
    content: '';
    position: absolute;
    bottom: -1px; right: -1px;
    width: 160px; height: 160px;
    background: var(--red);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    opacity: 0.06;
  }

  .logo-wrap {
    width: 200px;
    margin-bottom: 24px;
    animation: fadeUp 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  .logo-wrap img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 6px;
    animation: fadeUp 0.7s 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 3px;
    color: var(--white);
    line-height: 1;
    animation: fadeUp 0.7s 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  .headline span {
    color: var(--red);
  }

  .divider {
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, var(--red), transparent);
    margin: 14px 0;
    animation: expandW 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes expandW {
    from { width: 0; opacity: 0; }
    to   { width: 40px; opacity: 1; }
  }

  .subtitle {
    font-size: 13px;
    font-weight: 300;
    color: var(--lgray);
    line-height: 1.6;
    max-width: 280px;
    animation: fadeUp 0.7s 0.45s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── CONTACTS ──────────────────────────────────────── */
  .contacts {
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    text-decoration: none;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  .contact-item:nth-child(1) { animation-delay: 0.5s; }
  .contact-item:nth-child(2) { animation-delay: 0.58s; }
  .contact-item:nth-child(3) { animation-delay: 0.66s; }

  .contact-item:hover {
    background: rgba(255,255,255,0.04);
    transform: translateX(4px);
  }

  .contact-item:active {
    transform: scale(0.98);
  }

  .icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(196,26,26,0.12);
    border: 1px solid rgba(196,26,26,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }

  .contact-item:hover .icon-wrap {
    background: rgba(196,26,26,0.2);
    border-color: rgba(196,26,26,0.4);
  }

  .icon-wrap svg {
    width: 18px;
    height: 18px;
    fill: var(--red);
  }

  .contact-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 2px;
    font-family: 'Barlow Condensed', sans-serif;
  }

  .contact-value {
    font-size: 14px;
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.3px;
  }

  /* ─── SAVE BUTTON ───────────────────────────────────── */
  .save-wrap {
    padding: 6px 32px 28px;
    animation: fadeUp 0.6s 0.85s cubic-bezier(0.16,1,0.3,1) both;
  }

  .save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--red) 0%, #a01212 100%);
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(196,26,26,0.35);
  }

  .save-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
  }

  .save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(196,26,26,0.5);
  }

  .save-btn:active {
    transform: translateY(0) scale(0.98);
  }

  /* ─── FOOTER ────────────────────────────────────────── */
  .card-footer {
    padding: 14px 32px 18px;
    border-top: 1px solid rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: fadeUp 0.6s 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }

  .footer-brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
  }

  .footer-brand strong {
    color: var(--red);
    font-weight: 700;
  }

  .footer-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--red);
    opacity: 0.5;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50%       { opacity: 0.15; }
  }

  .footer-location {
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Barlow Condensed', sans-serif;
  }

  .footer-location svg {
    width: 10px; height: 10px;
    fill: var(--red);
    opacity: 0.7;
  }

  /* Save confirmation */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #1e2430;
    border: 1px solid rgba(196,26,26,0.3);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 13px;
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

</style>
</head>

<script>
function saveContact() {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:AutoBridge Vehicle Imports",
    "ORG:AutoBridge",
    "TEL;TYPE=CELL,VOICE:+306948886830",
    "TEL;TYPE=CELL,VOICE:+306984170093",
    "ADR;TYPE=WORK:;;Πειραιάς;;;Ελλάδα",
    "URL:https://autobridge.gr",
    "END:VCARD"
  ].join("\r\n");

  const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "AutoBridge.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  // Toast
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>

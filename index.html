<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBridge — Vehicle Imports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #05060a;
  --card:     #0a0c12;
  --surface:  #111420;
  --border:   rgba(255,255,255,0.07);
  --red:      #b91c1c;
  --red-glow: rgba(185,28,28,0.25);
  --silver:   #c8ccd8;
  --silver2:  #8890a8;
  --gold:     #a07820;
  --white:    #eef0f8;
  --dim:      #40445a;
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow', sans-serif;
  overflow-x: hidden;
}

/* Deep background gradients */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 40%, rgba(185,28,28,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 50% 70% at 85% 70%, rgba(185,28,28,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 80% 40% at 50% 100%, rgba(100,110,160,0.05) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

/* Subtle grid */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}

/* ── CARD ── */
.card {
  position: relative; z-index: 1;
  width: min(420px, 94vw);
  background: var(--card);
  border-radius: 24px;
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 40px 100px rgba(0,0,0,0.8),
    0 0 80px var(--red-glow);
  animation: cardIn 1s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes cardIn {
  from { opacity:0; transform: translateY(40px) scale(0.94); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

/* Top chrome line — silver gradient */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(200,204,216,0.6) 30%,
    rgba(200,204,216,0.9) 50%,
    rgba(200,204,216,0.6) 70%,
    transparent 100%);
  z-index: 10;
}

/* ── HERO ── */
.hero {
  position: relative;
  padding: 40px 32px 32px;
  background: linear-gradient(170deg, #13161f 0%, #0a0c12 70%);
  overflow: hidden;
}

/* Radial light behind logo */
.hero::before {
  content: '';
  position: absolute;
  top: -20px; left: 50%; transform: translateX(-50%);
  width: 300px; height: 200px;
  background: radial-gradient(ellipse, rgba(185,28,28,0.12) 0%, transparent 70%);
  pointer-events: none;
}

/* Bottom separator */
.hero::after {
  content: '';
  position: absolute; bottom: 0; left: 32px; right: 32px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

.logo-wrap {
  width: 240px;
  margin: 0 auto 28px;
  animation: fadeUp 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  filter: drop-shadow(0 0 20px rgba(185,28,28,0.2));
}
.logo-wrap img { width: 100%; display: block; }

/* Eyebrow label */
.eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
  margin-bottom: 10px;
  animation: fadeUp 0.7s 0.3s cubic-bezier(0.16,1,0.3,1) both;
}

/* Thin chrome divider */
.chrome-line {
  width: 60px;
  height: 1px;
  margin: 0 auto 16px;
  background: linear-gradient(90deg, transparent, var(--silver2), transparent);
  animation: expandW 0.8s 0.45s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes expandW {
  from { width: 0; opacity: 0; }
  to   { width: 60px; opacity: 1; }
}

.tagline {
  font-size: 13px;
  font-weight: 300;
  color: var(--silver2);
  text-align: center;
  line-height: 1.7;
  letter-spacing: 0.3px;
  animation: fadeUp 0.7s 0.4s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── CONTACTS ── */
.contacts {
  padding: 20px 24px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 13px 16px;
  border-radius: 12px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.25s;
  text-decoration: none;
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
}
.contact-item:nth-child(1) { animation-delay: 0.55s; }
.contact-item:nth-child(2) { animation-delay: 0.63s; }
.contact-item:nth-child(3) { animation-delay: 0.71s; }

.contact-item:hover {
  background: rgba(255,255,255,0.03);
  border-color: rgba(185,28,28,0.2);
  transform: translateX(4px);
}

/* Icon */
.icon-wrap {
  width: 42px; height: 42px;
  border-radius: 11px;
  background: var(--surface);
  border: 1px solid rgba(200,204,216,0.08);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.icon-wrap::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 60%);
}
.contact-item:hover .icon-wrap {
  border-color: rgba(185,28,28,0.35);
  background: rgba(185,28,28,0.08);
}
.icon-wrap svg { width: 17px; height: 17px; fill: var(--silver); transition: fill 0.25s; }
.contact-item:hover .icon-wrap svg { fill: var(--red); }

/* Text */
.contact-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 3px;
}
.contact-value {
  font-size: 15px;
  font-weight: 400;
  color: var(--white);
  letter-spacing: 0.5px;
}

/* ── SAVE BUTTON ── */
.save-wrap {
  padding: 20px 24px 24px;
  animation: fadeUp 0.6s 0.85s cubic-bezier(0.16,1,0.3,1) both;
}

.save-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid rgba(200,204,216,0.12);
  color: var(--silver);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.save-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%);
}
.save-btn::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,204,216,0.3), transparent);
}
.save-btn:hover {
  background: rgba(185,28,28,0.12);
  border-color: rgba(185,28,28,0.4);
  color: var(--white);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(185,28,28,0.2);
}
.save-btn:active { transform: scale(0.98); }

/* ── FOOTER ── */
.card-footer {
  padding: 14px 28px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: fadeUp 0.6s 0.95s cubic-bezier(0.16,1,0.3,1) both;
}

.footer-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--dim);
}
.footer-brand strong { color: var(--red); font-weight: 700; }

.footer-sep {
  width: 1px; height: 16px;
  background: var(--border);
}

.footer-loc {
  display: flex; align-items: center; gap: 5px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
}
.footer-loc svg { width: 9px; height: 9px; fill: var(--red); opacity: 0.7; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--surface);
  border: 1px solid rgba(200,204,216,0.12);
  color: var(--silver);
  padding: 11px 22px;
  border-radius: 100px;
  font-size: 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7);
  transition: all 0.45s cubic-bezier(0.16,1,0.3,1);
  z-index: 100; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
